<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SaveGuru</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    color-scheme: dark;
    background: #080a0e;
}

body {
    font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    background:
        radial-gradient(circle at top right, #493919, transparent 40%),
        linear-gradient(135deg, #080a0e, #17191e, #080a0e);
    background-attachment: fixed;
    -webkit-text-size-adjust: 100%;
}

.container {
    width: 100%;
    max-width: 430px;
    padding: clamp(20px, 5vw, 30px);
    border-radius: 26px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(218,177,91,0.25);
    box-shadow: 0 25px 70px rgba(0,0,0,0.5);
}

.header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    width: 65px;
    height: 65px;
    margin: 0 auto 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    font-size: 30px;
    color: #17130a;
    background: linear-gradient(135deg, #f9e2a2, #c79537, #f8d985);
    box-shadow: 0 8px 30px rgba(218,177,91,0.25);
}

.header h1 {
    font-family: 'Cinzel', 'Times New Roman', serif;
    color: #f8e5b5;
    font-size: clamp(26px, 7vw, 32px);
    font-weight: 700;
    letter-spacing: 3px;
}

.header p {
    color: #99958c;
    font-size: 12px;
    margin-top: 8px;
}

.tabs {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.tab {
    width: 100%;
    min-height: 88px;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px;
    border-radius: 19px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    color: #fff;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    -webkit-appearance: none;
}

.tab:focus-visible {
    outline: 2px solid #f4d58d;
    outline-offset: 3px;
}

@media (hover: hover) {
    .tab:hover {
        border-color: rgba(198,156,80,0.6);
        background: rgba(255,255,255,0.055);
    }
}

.tab-icon {
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    background: rgba(218,177,91,0.10);
    font-size: 25px;
    flex-shrink: 0;
    transition: background 0.3s ease;
}

.tab-info {
    flex: 1;
    min-width: 0;
}

.tab-info h3 {
    font-size: 15px;
    font-weight: 600;
    color: #f5e6c5;
}

.tab-info p {
    font-size: 11px;
    color: #99958c;
    margin-top: 5px;
}

.arrow {
    font-size: 25px;
    color: #9d895c;
    transition: color 0.3s ease, transform 0.3s ease;
    flex-shrink: 0;
}

.tab.active {
    background: linear-gradient(
        110deg,
        rgba(218,177,91,0.19),
        rgba(255,255,255,0.04)
    );
    border: 1px solid #c69c50;
    box-shadow: 0 8px 28px rgba(218,177,91,0.12);
}

.tab.active .tab-icon {
    background: linear-gradient(135deg, #f5d990, #b88935);
}

.tab.active .arrow {
    color: #f4d58d;
    transform: translateX(5px);
}

.tab:active {
    transform: scale(0.98);
}

.selected {
    margin-top: 25px;
    padding: 16px;
    text-align: center;
    border-radius: 14px;
    background: rgba(218,177,91,0.08);
    border: 1px solid rgba(218,177,91,0.16);
    color: #e8c77e;
    font-size: 14px;
    font-weight: 600;
}

.footer {
    text-align: center;
    color: #8a8579;
    font-size: 10px;
    margin-top: 25px;
}

/* Small mobile screens */
@media (max-width: 360px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 20px 15px;
        border-radius: 21px;
    }

    .header {
        margin-bottom: 25px;
    }

    .tab {
        min-height: 78px;
        padding: 12px;
        gap: 10px;
    }

    .tab-icon {
        width: 44px;
        height: 44px;
        font-size: 22px;
    }

    .tab-info h3 {
        font-size: 14px;
    }
}

/* Tablet and desktop */
@media (min-width: 600px) {
    .container {
        max-width: 460px;
        padding: 35px;
    }
}

/* Animation */
@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition: none !important;
        animation: none !important;
    }
}
</style>
</head>

<body>

<main class="container">

    <header class="header">
        <div class="logo" aria-hidden="true">♛</div>
        <h1>SaveGuru</h1>
        <p>Select your preferred section</p>
    </header>

    <div class="tabs" role="group" aria-label="Section">

        <button type="button" class="tab active" aria-pressed="true" data-name="Personal" data-url="https://earlylike.github.io/Work/">
            <div class="tab-icon" aria-hidden="true">👤</div>
            <div class="tab-info">
                <h3>Personal</h3>
                <p>Your own duty</p>
            </div>
            <div class="arrow" aria-hidden="true">›</div>
        </button>

        <button type="button" class="tab" aria-pressed="false" data-name="Duty Manager" data-url="https://earlylike.github.io/forall/">
            <div class="tab-icon" aria-hidden="true">👥</div>
            <div class="tab-info">
                <h3>Duty Manager</h3>
                <p>Handle duties of multiple people</p>
            </div>
            <div class="arrow" aria-hidden="true">›</div>
        </button>

    </div>

    <div class="selected" id="selected" role="status" aria-live="polite">
        Personal Selected
    </div>

    <footer class="footer">
        © 2026 All Rights Reserved
    </footer>

</main>

<script>
(function () {
    var tabs = document.querySelectorAll('.tab');
    var selected = document.getElementById('selected');

    function selectTab(button) {
        tabs.forEach(function (tab) {
            var isActive = tab === button;
            tab.classList.toggle('active', isActive);
            tab.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });

        selected.style.animation = 'none';
        void selected.offsetHeight; // restart animation
        selected.textContent = button.dataset.name + ' Selected';
        selected.style.animation = 'fade 0.35s ease';

        var url = button.dataset.url;
        if (url) {
            selected.textContent = 'Opening ' + button.dataset.name + '...';
            setTimeout(function () { window.location.href = url; }, 300);
        }
    }

    tabs.forEach(function (tab) {
        tab.addEventListener('click', function () { selectTab(tab); });
    });
})();
</script>

</body>
</html>
