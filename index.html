<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BillKarta</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    color-scheme: dark;
    background: #080a0e;
}

body {
    font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    background:
        radial-gradient(circle at top right, #493919, transparent 40%),
        linear-gradient(135deg, #080a0e, #17191e, #080a0e);
    background-attachment: fixed;
    -webkit-text-size-adjust: 100%;
}

.container {
    width: 100%;
    max-width: 430px;
    padding: calc(clamp(20px, 5vw, 30px) + 1cm) clamp(20px, 5vw, 30px);
    border-radius: 26px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(218,177,91,0.25);
    box-shadow: 0 25px 70px rgba(0,0,0,0.5);
}

.header {
    text-align: center;
    margin-bottom: 35px;
}

.header h1.brand {
    line-height: 0;
}

.header h1.brand img {
    display: block;
    margin: 0 auto;
    height: 36px;
    width: auto;
    max-width: 75%;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
}

.header p {
    color: #99958c;
    font-size: 12px;
    margin-top: 8px;
}

.tabs {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.tab {
    width: 100%;
    min-height: 88px;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px;
    border-radius: 19px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    color: #fff;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    -webkit-appearance: none;
}

.tab:focus-visible {
    outline: 2px solid #f4d58d;
    outline-offset: 3px;
}

@media (hover: hover) {
    .tab:hover {
        border-color: rgba(198,156,80,0.6);
        background: rgba(255,255,255,0.055);
    }
}

.tab-icon {
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    background: rgba(218,177,91,0.10);
    font-size: 25px;
    flex-shrink: 0;
    transition: background 0.3s ease;
}

.tab-info {
    flex: 1;
    min-width: 0;
}

.tab-info h3 {
    font-size: 15px;
    font-weight: 600;
    color: #f5e6c5;
}

.tab-info p {
    font-size: 11px;
    color: #99958c;
    margin-top: 5px;
}

.arrow {
    font-size: 25px;
    color: #9d895c;
    transition: color 0.3s ease, transform 0.3s ease;
    flex-shrink: 0;
}

.tab.active {
    background: linear-gradient(
        110deg,
        rgba(218,177,91,0.19),
        rgba(255,255,255,0.04)
    );
    border: 1px solid #c69c50;
    box-shadow: 0 8px 28px rgba(218,177,91,0.12);
}

.tab.active .tab-icon {
    background: linear-gradient(135deg, #f5d990, #b88935);
}

.tab.active .arrow {
    color: #f4d58d;
    transform: translateX(5px);
}

.tab:active {
    transform: scale(0.98);
}

.selected {
    margin-top: 25px;
    padding: 16px;
    text-align: center;
    border-radius: 14px;
    background: rgba(218,177,91,0.08);
    border: 1px solid rgba(218,177,91,0.16);
    color: #e8c77e;
    font-size: 14px;
    font-weight: 600;
}

/* Small mobile screens */
@media (max-width: 360px) {
    body {
        padding: 12px;
    }

    .container {
        padding: calc(20px + 1cm) 15px;
        border-radius: 21px;
    }

    .header {
        margin-bottom: 25px;
    }

    .tab {
        min-height: 78px;
        padding: 12px;
        gap: 10px;
    }

    .tab-icon {
        width: 44px;
        height: 44px;
        font-size: 22px;
    }

    .tab-info h3 {
        font-size: 14px;
    }
}

/* Tablet and desktop */
@media (min-width: 600px) {
    .container {
        max-width: 460px;
        padding: calc(35px + 1cm) 35px;
    }
}

/* Animation */
@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* No-internet popup (modelled on the earlier BillKarta page, in the gold theme) */
#offline {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.2rem;
    background: radial-gradient(circle at top right, rgba(73,57,25,0.96), rgba(8,10,14,0.96) 62%);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
}

#offline[hidden] {
    display: none;
}

.off-card {
    width: 100%;
    max-width: 23rem;
    text-align: center;
    background: #17191e;
    color: #f5e6c5;
    border: 1px solid rgba(218,177,91,0.3);
    border-radius: 28px;
    padding: 2rem 1.5rem 1.6rem;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    animation: offin 0.35s ease-out;
}

@keyframes offin {
    from { opacity: 0; transform: translateY(16px) scale(0.96); }
    to   { opacity: 1; transform: none; }
}

.off-ic {
    position: relative;
    width: 96px;
    height: 96px;
    margin: 0 auto 1.2rem;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #f59e0b, #f43f5e);
    box-shadow: 0 10px 24px rgba(244,63,94,0.4);
}

.off-ic::before,
.off-ic::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(244,63,94,0.45);
    animation: offring 2.2s ease-out infinite;
}

.off-ic::after {
    animation-delay: 1.1s;
}

@keyframes offring {
    from { transform: scale(1); opacity: 0.9; }
    to   { transform: scale(1.7); opacity: 0; }
}

.off-ic svg {
    width: 48px;
    height: 48px;
    fill: none;
    stroke: #fff;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.off-card h2 {
    margin: 0 0 0.5rem;
    font-size: 1.4rem;
    font-weight: 700;
    color: #f8e5b5;
}

.off-card p {
    margin: 0 0 1.3rem;
    color: #99958c;
    font-size: 0.95rem;
    line-height: 1.5;
}

.off-btn {
    width: 100%;
    min-height: 48px;
    padding: 0.7rem 1.1rem;
    border: 0;
    border-radius: 14px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #17130a;
    background: linear-gradient(135deg, #f9e2a2, #c79537, #f8d985);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.off-btn:active {
    transform: scale(0.98);
}

.off-btn:focus-visible {
    outline: 2px solid #f4d58d;
    outline-offset: 3px;
}

.off-wait {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #99958c;
}

.off-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #f43f5e;
    animation: offdot 1.2s ease-in-out infinite;
}

@keyframes offdot {
    50% { opacity: 0.25; transform: scale(0.7); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition: none !important;
        animation: none !important;
    }
}
</style>
</head>

<body>

</div>

<script>
(function () {
    var tabs = document.querySelectorAll('.tab');
    var selected = document.getElementById('selected');

    // ---- Offline popup: show instantly when there is no internet, reload when it returns ----
    var offEl = document.getElementById('offline');
    var offRetry = document.getElementById('offretry');
    var page = document.querySelector('.container');
    var startedOffline = false;
    var offTimer = null;

    function showOff() {
        if (!offEl.hidden) return;
        offEl.hidden = false;
        document.body.style.overflow = 'hidden';
        if ('inert' in page) page.inert = true;   // keep taps and keyboard focus off the page behind
        offRetry.focus();
    }

    function hideOff() {
        if (offEl.hidden) return;
        offEl.hidden = true;
        document.body.style.overflow = '';
        if ('inert' in page) page.inert = false;
    }

    function checkNet() {
        if (navigator.onLine === false) {
            showOff();
            if (!offTimer) offTimer = setInterval(checkNet, 2000);
        } else {
            if (offTimer) { clearInterval(offTimer); offTimer = null; }
            hideOff();
            if (startedOffline) { startedOffline = false; location.reload(); }
        }
    }

    if (navigator.onLine === false) startedOffline = true;
    window.addEventListener('offline', checkNet);
    window.addEventListener('online', checkNet);
    offRetry.addEventListener('click', checkNet);

    // ---- Tabs ----
    function selectTab(button) {
        // No internet: show the popup instead of opening a page that cannot load
        if (navigator.onLine === false) { checkNet(); return; }

        tabs.forEach(function (tab) {
            var isActive = tab === button;
            tab.classList.toggle('active', isActive);
            tab.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });

        selected.style.animation = 'none';
        void selected.offsetHeight; // restart animation
        selected.textContent = button.dataset.name + ' Selected';
        selected.style.animation = 'fade 0.35s ease';

        var url = button.dataset.url;
        if (url) {
            selected.textContent = 'Opening ' + button.dataset.name + '...';
            setTimeout(function () { window.location.href = url; }, 300);
        }
    }

    tabs.forEach(function (tab) {
        tab.addEventListener('click', function () { selectTab(tab); });
    });

    // Init
    checkNet();
})();
</script>
